name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        exercise: [01-agent-basics, 02-sdlc-loop]
        python-version: ["3.12"]
        include:
          - os: ubuntu-24.04
            exercise: 01-agent-basics
            python-version: "3.10"
          - os: ubuntu-24.04
            exercise: 02-sdlc-loop
            python-version: "3.10"
    defaults:
      run:
        working-directory: exercises/${{ matrix.exercise }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
